<div class="mascot-widget" (click)="onMascotClick()" title="¡Toca a Plumi para escuchar un consejo!">
  <div class="mascot-speech-bubble anim-pop">
    <div class="bubble-arrow"></div>
    <span class="speech-text">{{ gamification.mascotMessage() }}</span>
    <span class="speech-action-hint">👆 ¡Tócame para un consejo sabio!</span>
  </div>
  <div class="mascot-character anim-float">
    <div class="owl-body">
      <div class="owl-eyes">
        <span class="eye left">👀</span>
      </div>
      <div class="owl-avatar">🦉</div>
    </div>
    <div class="mascot-name-badge">
      <span class="mascot-name">Plumi</span>
      <span class="mascot-role">Guía Lector</span>
    </div>
  </div>
</div>
